name: Docker Build Test

on:
  push:
    branches:
      - feat/docker-image-signing

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: brightsec/devops

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Test Cosign with bash shell
        shell: bash
        run: |
          echo "Testing bash shell and cosign..."
          cosign version
          
          # Test bash syntax that failed before
          TEST_DIGEST="sha256:43000e0c51ffd19cbc8aab47e7cdc4487f49e87370a54c5dccb308f207028050"
          if [[ -z "$TEST_DIGEST" || ! "$TEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Bash regex test failed"
            exit 1
          fi
          echo "✓ Bash shell and regex validation working correctly"
          echo "✓ Cosign installed successfully"
