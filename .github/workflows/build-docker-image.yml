name: Docker Image CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Build-only on PRs (no push, no sign)
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    name: validate (${{ matrix.arch }})
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./chromium
          platforms: ${{ matrix.platform }}
          push: false

  # Push to registries on master only
  build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            tag_suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag_suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_BRIGHT_USER }}
          password: ${{ secrets.DOCKERHUB_BRIGHT_TOKEN }}

      - name: Build and push (per-platform)
        uses: docker/build-push-action@v6
        with:
          context: ./chromium
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            brightsec/nextools-chrome:${{ matrix.tag_suffix }}
            454884832027.dkr.ecr.us-east-1.amazonaws.com/nextools-chrome:${{ matrix.tag_suffix }}

  merge-manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_BRIGHT_USER }}
          password: ${{ secrets.DOCKERHUB_BRIGHT_TOKEN }}

      - name: Create and push manifest list (Docker Hub)
        run: |
          docker buildx imagetools create \
            --tag brightsec/nextools-chrome:latest \
            brightsec/nextools-chrome:amd64 \
            brightsec/nextools-chrome:arm64

      - name: Create and push manifest list (ECR)
        run: |
          docker buildx imagetools create \
            --tag 454884832027.dkr.ecr.us-east-1.amazonaws.com/nextools-chrome:latest \
            454884832027.dkr.ecr.us-east-1.amazonaws.com/nextools-chrome:amd64 \
            454884832027.dkr.ecr.us-east-1.amazonaws.com/nextools-chrome:arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: 'v3.0.4'

      - name: Get image digest and sign
        env:
          REGISTRY_ENDPOINT: 454884832027.dkr.ecr.us-east-1.amazonaws.com/nextools-chrome
        run: |
          set -e
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY_ENDPOINT}:latest" --format '{{.Manifest.Digest}}')
          if [[ -z "$DIGEST" || ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Failed to extract valid digest"
            exit 1
          fi
          echo "IMAGE_DIGEST=${REGISTRY_ENDPOINT}@${DIGEST}" >> $GITHUB_ENV
          cosign sign --yes "${REGISTRY_ENDPOINT}@${DIGEST}"

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/NeuraLegion/[^/]+/.+$" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_DIGEST}"
